version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: job_queue_db
    environment:
      POSTGRES_USER: queue_user
      POSTGRES_PASSWORD: queue_password
      POSTGRES_DB: job_queue
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queue_user -d job_queue"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: job_queue_web
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/workspace
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://queue_user:queue_password@db:5432/job_queue
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    container_name: job_queue_worker
    command: python -m app.worker
    volumes:
      - .:/workspace
    environment:
      DATABASE_URL: postgresql+psycopg2://queue_user:queue_password@db:5432/job_queue
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: